<!doctype html><html lang="en"><head><meta charset="utf-8"></head><body>
<title>Radiator</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Public+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Public+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"></noscript>

<style>
:root{
  /* Warm Modern — light */
  --heat:#F26B3A; --heat-deep:#C24634; --heat-soft:#FBE3D6; --brand2:#F59E2E;
  --brand-grad:linear-gradient(150deg,#F59E2E,#F26B3A 55%,#E0574A);
  --azure:#3B6FA0; --azure-deep:#2E587F; --azure-soft:#EAF0F6;
  --paper:#FFF8F2; --surface:#FFFFFF; --surface-2:#F3E7DC; --surface-3:#EDE4DA;
  --ink:#2A2320; --ink-soft:#6F645B; --ink-faint:#A08B7D;
  --line:rgba(60,30,15,0.10); --line-strong:rgba(60,30,15,0.17);
  --good:#2F7D58; --good-soft:#EEF6F0;
  --watch:#9A7409; --watch-soft:#FBEBC8;
  --risk:#C24634; --risk-soft:#FBE0DB;
  --shadow-sm:0 1px 2px rgba(60,30,15,.05), 0 1px 3px rgba(60,30,15,.05);
  --shadow:0 2px 8px rgba(60,30,15,.06), 0 24px 60px -30px rgba(60,30,15,.4);
  --shadow-lg:0 24px 72px -22px rgba(60,30,15,.5);
  --r:18px; --r-sm:12px;
  --display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  --sans:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --serif:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"Space Mono",ui-monospace,monospace;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
  --heat:#F26B3A; --heat-deep:#F0895A; --heat-soft:rgba(242,107,58,0.18);
  --azure:#6BA8E0; --azure-deep:#8FC0EC; --azure-soft:rgba(107,168,224,0.16);
  --paper:#211B18; --surface:#2C2521; --surface-2:#332A25; --surface-3:#3C322C;
  --ink:#F5EDE6; --ink-soft:#B7A99E; --ink-faint:#9A8B80;
  --line:rgba(255,255,255,0.08); --line-strong:rgba(255,255,255,0.15);
  --good:#6FD3A0; --good-soft:rgba(55,148,106,0.20); --watch:#F5C956; --watch-soft:rgba(224,163,46,0.20); --risk:#F0897C; --risk-soft:rgba(224,87,74,0.20);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow:0 2px 8px rgba(0,0,0,.35),0 24px 60px -30px rgba(0,0,0,.6); --shadow-lg:0 24px 72px -22px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --heat:#F26B3A; --heat-deep:#F0895A; --heat-soft:rgba(242,107,58,0.18);
  --azure:#6BA8E0; --azure-deep:#8FC0EC; --azure-soft:rgba(107,168,224,0.16);
  --paper:#211B18; --surface:#2C2521; --surface-2:#332A25; --surface-3:#3C322C;
  --ink:#F5EDE6; --ink-soft:#B7A99E; --ink-faint:#9A8B80;
  --line:rgba(255,255,255,0.08); --line-strong:rgba(255,255,255,0.15);
  --good:#6FD3A0; --good-soft:rgba(55,148,106,0.20); --watch:#F5C956; --watch-soft:rgba(224,163,46,0.20); --risk:#F0897C; --risk-soft:rgba(224,87,74,0.20);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow:0 2px 8px rgba(0,0,0,.35),0 24px 60px -30px rgba(0,0,0,.6); --shadow-lg:0 24px 72px -22px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
h1,h2,h3,.page-t,.brand .wm,.sb-brand .wm,.mob-brand .wm,.rail-score .grade,.rail-score .num,.scorechip .n,.hero .htext .name,.acct-hero .h,.statbox .n,.summary .big,.calc-out .big,.cbox .n,.access-card .big{font-family:var(--display); letter-spacing:-0.02em; font-weight:800}
.rail-score .grade{letter-spacing:-0.03em}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,textarea,select{font-family:inherit; font-size:15px; color:inherit}
a{color:var(--azure-deep); cursor:pointer}
:focus-visible{outline:2.5px solid var(--azure); outline-offset:2px; border-radius:4px}
img{max-width:100%; display:block}

/* ---------- shell ---------- */
.shell{max-width:1320px; margin:0 auto; display:grid; grid-template-columns:252px minmax(0,1fr); min-height:100vh; background:var(--paper)}
.sidebar{position:sticky; top:0; align-self:start; height:100vh; border-right:1px solid var(--line); background:var(--surface);
  display:flex; flex-direction:column; padding:20px 14px; gap:4px; overflow-y:auto}
.sb-brand{display:flex; align-items:center; gap:9px; padding:6px 8px 16px}
.sb-brand svg{width:28px; height:28px}
.sb-brand .wm{font-weight:900; font-size:1.35rem; letter-spacing:-.03em}
.sb-brand .wm b{color:var(--heat)}
.nav-i{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; font-weight:600; font-size:14.5px; color:var(--ink-soft); width:100%; text-align:left}
.nav-i svg{width:20px; height:20px; flex:none; opacity:.9}
.nav-i:hover{background:var(--surface-2)}
.nav-i.on{background:var(--heat-soft); color:var(--heat-deep)}
.nav-i.on svg{opacity:1}
.nav-i .badge{margin-left:auto; background:var(--heat); color:#fff; font-size:11px; font-weight:800; min-width:19px; height:19px; border-radius:10px; display:grid; place-items:center; padding:0 5px}
.sb-cta{margin:12px 4px 6px}
.sb-foot{margin-top:auto; padding:12px 8px 4px; border-top:1px solid var(--line)}
.modeflag{font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.04em; padding:2px 8px; border-radius:6px; text-transform:uppercase}
.modeflag.live{background:var(--good-soft); color:var(--good)} .modeflag.demo{background:var(--watch-soft); color:var(--watch)}

.main{min-width:0; display:flex; flex-direction:column}
.appbar{position:sticky; top:0; z-index:30; background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
  padding:12px 24px; display:flex; align-items:center; gap:14px}
.appbar .mob-brand{display:none; align-items:center; gap:8px}
.appbar .mob-brand svg{width:24px;height:24px} .appbar .mob-brand .wm{font-weight:900;font-size:1.15rem;letter-spacing:-.03em}
.appbar .mob-brand .wm b{color:var(--heat)}
.searchbox{flex:1; max-width:560px; display:flex; align-items:center; gap:10px; background:var(--surface);
  border:1.5px solid var(--line-strong); border-radius:12px; padding:10px 14px; box-shadow:var(--shadow-sm)}
.searchbox:focus-within{border-color:var(--heat)}
.searchbox svg{width:18px;height:18px;color:var(--ink-faint);flex:none}
.searchbox input{border:none; outline:none; background:none; width:100%; font-size:15px}
.appbar .back{width:36px;height:36px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-size:17px;flex:none}
.appbar .spacer{flex:1}
.appbar .ab-title{font-weight:800; font-size:1.05rem; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

.content{padding:24px 24px 60px; max-width:1120px; width:100%; margin:0 auto}
.content.wide{max-width:1220px}
h1.page-t{font-size:1.65rem; font-weight:900; letter-spacing:-.02em; margin:2px 0 4px; text-wrap:balance}
.page-sub{color:var(--ink-soft); font-size:14px; margin:0 0 18px; max-width:66ch}
.section-t{font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-faint); margin:26px 2px 12px}

/* ---------- filters ---------- */
.filterbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px}
.selpill{position:relative; display:inline-flex; align-items:center; background:var(--surface); border:1.5px solid var(--line); border-radius:10px; padding:0 6px 0 12px; font-weight:600; font-size:13.5px; color:var(--ink-soft)}
.selpill select{border:none; background:none; padding:9px 6px; font-weight:600; color:var(--ink); outline:none}
.selpill.act{border-color:var(--heat); color:var(--heat-deep)}
.seg{display:inline-flex; background:var(--surface-2); border-radius:10px; padding:3px}
.seg button{font-size:13px; font-weight:700; padding:7px 14px; border-radius:8px; color:var(--ink-soft)}
.seg button.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm)}
.result-meta{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:12px; flex-wrap:wrap}
.result-meta .count{font-family:var(--mono); font-size:12px; color:var(--ink-faint)}

/* ---------- building grid + cards ---------- */
.bgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px}
.bcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow-sm); text-align:left; width:100%; display:flex; flex-direction:column; transition:transform .1s, box-shadow .15s}
.bcard:hover{box-shadow:var(--shadow); transform:translateY(-2px)}
.bcard .thumb{height:96px; position:relative; display:flex; align-items:flex-end; padding:10px}
.bcard .thumb .ph-emoji{position:absolute; right:12px; bottom:10px; font-size:26px; opacity:.85}
.bcard .thumb .score-badge{position:absolute; top:10px; left:10px}
.scorechip{display:inline-flex; align-items:center; gap:7px; background:rgba(0,0,0,.32); backdrop-filter:blur(3px); color:#fff; border-radius:9px; padding:4px 9px 4px 5px; font-weight:800}
.scorechip .g{width:24px; height:24px; border-radius:6px; display:grid; place-items:center; font-size:13px; font-weight:900; color:#fff}
.scorechip .n{font-size:14px; font-variant-numeric:tabular-nums}
.scorechip .n small{font-weight:600; opacity:.8; font-size:10px}
.gA{background:#37946A} .gB{background:#4A9D5F} .gC{background:#E0A32E} .gD{background:#E07E3A} .gF{background:#E0574A}
.bcard-body{padding:13px 15px 14px; display:flex; flex-direction:column; gap:2px; flex:1}
.bcard-body .name{font-weight:800; font-size:1.02rem; letter-spacing:-.015em; line-height:1.2}
.bcard-body .addr{color:var(--ink-soft); font-size:12.5px}
.recline{display:flex; align-items:center; gap:7px; margin-top:9px; font-family:var(--mono); font-size:11px; color:var(--ink-soft); flex-wrap:wrap}
.recline .sep{color:var(--line-strong)}
.bcard .meta{display:flex; align-items:center; gap:8px; margin-top:11px; flex-wrap:wrap; justify-content:space-between}
.bcard .cmpbtn{font-size:11.5px; font-weight:700; color:var(--azure-deep); padding:5px 9px; border-radius:8px; border:1.5px solid var(--line)}
.bcard .cmpbtn.on{background:var(--azure); color:#fff; border-color:var(--azure)}

.rating-pill{display:inline-flex; align-items:center; gap:5px; font-weight:800; font-size:.9rem}
.rating-pill small{color:var(--ink-faint); font-weight:600; font-size:11.5px}
.stars{position:relative; display:inline-block; font-size:13px; line-height:1; font-family:Arial,sans-serif; letter-spacing:1px; white-space:nowrap}
.stars-base{color:var(--line-strong)} .stars-fill{position:absolute; top:0; left:0; overflow:hidden; color:var(--heat); white-space:nowrap}
.flag{display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; padding:4px 9px; border-radius:999px}
.flag.good{background:var(--good-soft); color:var(--good)} .flag.watch{background:var(--watch-soft); color:var(--watch)} .flag.risk{background:var(--risk-soft); color:var(--risk)}
.flag .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* ---------- map ---------- */
.maplayout{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:18px; align-items:start}
@media(max-width:1040px){.maplayout{grid-template-columns:1fr}}
.mapbox{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow-sm)}
.mapbox svg{display:block; width:100%; height:auto; background:linear-gradient(180deg,var(--surface-2),var(--surface))}
.hoodpath{fill:color-mix(in srgb,var(--azure) 6%,var(--surface)); stroke:var(--line-strong); stroke-width:.6; stroke-linejoin:round; cursor:pointer}
.hoodpath:hover{fill:color-mix(in srgb,var(--heat) 8%,var(--surface))}
.hoodpath.sel{fill:color-mix(in srgb,var(--heat) 15%,var(--surface)); stroke:var(--heat); stroke-width:1.1}
.bdot{cursor:pointer; stroke:#fff; stroke-width:.7}
.bdot.g{fill:var(--good)} .bdot.w{fill:var(--watch)} .bdot.r{fill:var(--risk)}
.bpin{cursor:pointer} .bpin path{stroke:#fff; stroke-width:1; paint-order:stroke; filter:drop-shadow(0 1.5px 1.5px rgba(60,30,15,.28))}
.bpin.g path{fill:var(--good)} .bpin.w path{fill:var(--watch)} .bpin.r path{fill:var(--risk)}
.bpin:hover path{filter:drop-shadow(0 2px 3px rgba(60,30,15,.4))}
.maplegend{display:flex; gap:16px; justify-content:center; padding:12px; font-family:var(--mono); font-size:11px; color:var(--ink-soft); flex-wrap:wrap; border-top:1px solid var(--line)}
.maplegend span{display:inline-flex; align-items:center; gap:6px} .maplegend i{width:9px;height:9px;border-radius:50%}
.map-side{display:flex; flex-direction:column; gap:12px}
.map-side .hint{font-size:13px; color:var(--ink-soft); background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px}

/* ---------- building profile ---------- */
.bprofile{display:grid; grid-template-columns:minmax(0,1fr) 336px; gap:22px; align-items:start}
@media(max-width:960px){.bprofile{grid-template-columns:1fr}}
.hero{position:relative; height:172px; display:flex; align-items:flex-end; padding:18px; border-radius:var(--r); overflow:hidden}
.hero .hero-emoji{position:absolute; right:18px; top:16px; font-size:46px; opacity:.9}
.hero .grad{position:absolute; inset:0; background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.62))}
.hero .htext{position:relative; color:#fff; text-shadow:0 1px 12px rgba(0,0,0,.4)}
.hero .htext .name{font-size:1.5rem; font-weight:900; letter-spacing:-.02em; line-height:1.06}
.hero .htext .addr{font-size:13.5px; opacity:.95; margin-top:3px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-sm)}
.card + .card{margin-top:16px}
.card-h{padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:10px; border-bottom:1px solid var(--line); background:var(--surface-2)}
.card-h .t{font-weight:800; font-size:.98rem; display:flex; align-items:center; gap:8px}
.card-b{padding:16px 18px}
.summary-txt{font-family:var(--serif); font-size:1.08rem; line-height:1.6; color:var(--ink)}
.summary-txt b{font-weight:600}

.subscores{display:grid; grid-template-columns:1fr 1fr; gap:12px 22px; margin-top:2px}
@media(max-width:520px){.subscores{grid-template-columns:1fr}}
.subrow{display:grid; grid-template-columns:96px 1fr 28px; align-items:center; gap:9px}
.subrow .lab{font-size:12.5px; color:var(--ink-soft); font-weight:600}
.subrow .bar{height:7px; border-radius:4px; background:var(--surface-3); overflow:hidden}
.subrow .bar i{display:block; height:100%; border-radius:4px; background:var(--heat)}
.subrow .v{font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums; text-align:right; color:var(--ink-soft)}
.brk{display:flex;flex-direction:column;gap:14px}
.brk .brow .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brk .brow .nm{font-weight:700;font-size:13.5px}
.brk .brow .wt{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.04em}
.brk .brow .val{font-family:var(--display);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.brk .brow .sub{font-size:11.5px;color:var(--ink-faint);margin:1px 0 6px}
.brk .track{height:9px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.brk .track i{display:block;height:100%;border-radius:5px}
.brk-sum{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line-strong);margin-top:2px;padding-top:12px}
.brk-sum .lg{font-family:var(--display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}
.webbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.webbtns{grid-template-columns:1fr}}
.webbtn{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line-strong);border-radius:12px;padding:11px 13px;background:var(--surface);text-decoration:none;color:var(--ink);transition:.15s}
.webbtn:hover{border-color:var(--heat);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.webbtn .wbi{font-size:20px;flex:none;width:26px;text-align:center}
.webbtn .wbtxt{display:flex;flex-direction:column;line-height:1.25;min-width:0;flex:1}
.webbtn .wbt{font-weight:800;font-size:14px}
.webbtn .wbs{font-size:11.5px;color:var(--ink-faint)}
.webbtn .wbx{color:var(--ink-faint);font-size:13px;flex:none}
.webbtn:hover .wbx{color:var(--heat-deep)}

.drow{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:none}
.drow .dl{font-size:13.5px; color:var(--ink-soft)}
.drow .dv{font-weight:800; font-variant-numeric:tabular-nums; font-family:var(--mono); font-size:14px}
.drow .dv.n0{color:var(--good)} .drow .dv.n1{color:var(--watch)} .drow .dv.n2{color:var(--risk)}
.catbars{display:grid; gap:10px; margin-top:2px}
.catrow{display:grid; grid-template-columns:120px 1fr 34px; align-items:center; gap:10px}
.catrow .cl{font-size:13px; color:var(--ink-soft); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.catrow .cb{height:9px; border-radius:5px; background:var(--surface-3); overflow:hidden}
.catrow .cb i{display:block; height:100%; background:var(--risk); border-radius:5px}
.catrow .cv{font-family:var(--mono); font-size:12.5px; font-weight:600; text-align:right}
.rlto-note{font-size:12.5px; color:var(--ink-soft); line-height:1.5; padding:12px 0 2px; border-top:1px solid var(--line); margin-top:6px}
.rlto-note b{color:var(--ink)}
.src-note{font-family:var(--mono); font-size:10px; color:var(--ink-faint); padding:10px 0 0; line-height:1.5}
.pctbadge{display:inline-flex; align-items:center; gap:8px; background:var(--azure-soft); color:var(--azure-deep); border-radius:10px; padding:9px 13px; font-size:13px; font-weight:700; margin-top:12px}

/* right rail */
.rail-score{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-sm); padding:20px; text-align:center}
.rail-score .grade{width:76px; height:76px; margin:0 auto 10px; border-radius:20px; display:grid; place-items:center; font-size:2.3rem; font-weight:900; color:#fff}
.dial{width:104px; height:104px; margin:0 auto 12px; border-radius:50%; display:grid; place-items:center;
  background:conic-gradient(from 180deg, var(--tier,#F26B3A) var(--sweep,0deg), var(--surface-3) 0);}
.dial .dial-in{width:80px; height:80px; border-radius:50%; background:var(--surface); display:grid; place-items:center; box-shadow:var(--shadow-sm)}
.dial .dial-g{font-family:var(--display); font-weight:800; font-size:2rem; letter-spacing:-0.03em; color:var(--ink); line-height:1}
.rail-score .num{font-size:1.05rem; font-weight:800} .rail-score .num small{color:var(--ink-faint); font-weight:600}
.rail-score .lbl{font-family:var(--mono); font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; margin-top:3px}
.rail-actions{display:grid; gap:9px; margin-top:14px}
.gallery{display:flex; gap:9px; overflow-x:auto; padding:2px; scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery .g{width:118px; height:88px; border-radius:10px; flex:none; overflow:hidden; position:relative; display:grid; place-items:center; font-size:26px; border:1px solid var(--line)}
.gallery .g img{width:100%; height:100%; object-fit:cover}
.gallery .g .tag{position:absolute; bottom:5px; left:5px; font-family:var(--mono); font-size:8px; font-weight:600; background:rgba(0,0,0,.55); color:#fff; padding:2px 5px; border-radius:4px}

/* reviews */
.rev{padding:16px 0; border-bottom:1px solid var(--line)}
.rev:last-child{border-bottom:none}
.rev .rhead{display:flex; align-items:center; gap:10px}

details.res-wrap{margin-top:12px}

.bcard .thumb.hasimg{padding:0}

.vb-cur{background:var(--good-soft);color:var(--good)}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:800; font-size:14.5px; padding:12px 18px; border-radius:11px; letter-spacing:-.01em}

.fcard h3{font-family:var(--display);font-weight:800;font-size:1.18rem;margin:12px 0 6px;letter-spacing:-.01em}
.fcard p{font-size:14px;color:var(--ink-soft);line-height:1.55;margin:0}
.g2g-band{margin-top:24px;border-radius:22px;padding:32px 34px;color:#fff;background:linear-gradient(135deg,#2A2320,#3B2C22);display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap;box-shadow:var(--shadow)}
.g2g-band h2{font-family:var(--display);font-weight:800;font-size:1.55rem;letter-spacing:-.02em;margin:0 0 6px;color:#fff}
.g2g-band p{margin:0;color:rgba(255,248,242,.82);font-size:14.5px;max-width:52ch;line-height:1.5}
.g2g-band .btn{background:var(--brand-grad);color:#fff;white-space:nowrap;border:none}
.landing-foot{text-align:center;color:var(--ink-faint);font-family:var(--mono);font-size:11px;letter-spacing:.03em;margin:34px 0 10px}
.landing-foot a{color:var(--heat-deep);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.price-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:8px;align-items:stretch}
@media(max-width:900px){.price-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.price-grid{grid-template-columns:1fr}}
.pcard{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:22px 20px;display:flex;flex-direction:column;position:relative;box-shadow:var(--shadow-sm)}
.pcard.feature{border-color:var(--heat);box-shadow:0 20px 50px -28px rgba(226,87,58,.6)}
.pcard .ribbon{position:absolute;top:-11px;left:20px;background:var(--brand-grad);color:#fff;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:4px 10px;border-radius:999px}
.pcard .pname{font-family:var(--display);font-weight:800;font-size:1.15rem}
.pcard .pprice{font-family:var(--display);font-weight:800;font-size:2rem;letter-spacing:-.02em;margin:8px 0 2px}
.pcard .pprice small{font-size:.9rem;font-weight:600;color:var(--ink-faint);letter-spacing:0}
.pcard .ptag{font-size:12.5px;color:var(--ink-soft);min-height:34px}
.pcard ul{list-style:none;margin:14px 0 18px;padding:0;display:flex;flex-direction:column;gap:8px}
.pcard li{font-size:13px;color:var(--ink);display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.pcard li:before{content:"✓";color:var(--good);font-weight:800;flex:none}
.pcard .pbtn{margin-top:auto}
.price-rule{margin-top:22px;border:1.5px dashed var(--line-strong);border-radius:14px;padding:16px 18px;background:var(--surface-2);font-size:13.5px;color:var(--ink-soft);line-height:1.55}
.price-rule b{color:var(--ink)}
.mobtabs{display:none}
@media(max-width:920px){
  .shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .content{padding:18px 16px 90px}
  .appbar .mob-brand{display:flex}
  .mobtabs{display:grid; position:fixed; bottom:0; left:0; right:0; z-index:50; grid-template-columns:repeat(5,1fr);
    background:color-mix(in srgb,var(--surface) 93%,transparent); backdrop-filter:blur(14px); border-top:1px solid var(--line); padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
  .mtab{display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px; color:var(--ink-faint)}
  .mtab svg{width:22px;height:22px} .mtab .lb{font-size:10px; font-weight:700} .mtab.on{color:var(--heat)}
  .mtab.write .fab{width:42px;height:42px;margin-top:-2px;border-radius:13px;background:var(--heat);color:#fff;display:grid;place-items:center;box-shadow:0 5px 16px color-mix(in srgb,var(--heat) 45%,transparent)}
  .mtab.write .lb{color:var(--ink-faint)}
  .bprofile{grid-template-columns:1fr}
}
@media(min-width:921px){ .appbar .back.mob-only{display:none} }

#toast{position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--paper); padding:12px 18px; border-radius:11px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow-lg); z-index:100; opacity:0; pointer-events:none; transition:.28s; max-width:88%; text-align:center}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.modal-bg{position:fixed; inset:0; z-index:90; background:rgba(15,22,30,.55); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; opacity:0; transition:.25s; padding:20px}
.modal-bg.show{opacity:1}
.modal{background:var(--surface); width:100%; max-width:440px; border-radius:18px; padding:26px 24px; transform:translateY(14px) scale(.98); transition:.3s cubic-bezier(.2,.8,.2,1); box-shadow:var(--shadow-lg)}
.modal-bg.show .modal{transform:none}
.modal h3{margin:0 0 6px; font-size:1.3rem; font-weight:900; letter-spacing:-.02em} .modal p{margin:0 0 16px; color:var(--ink-soft); font-size:14px}
.modal .plan{border:1.5px solid var(--line-strong); border-radius:12px; padding:14px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer}
.modal .plan.pick{border-color:var(--heat); background:var(--heat-soft)} .modal .plan .pn{font-weight:800} .modal .plan .pd{font-size:12.5px; color:var(--ink-soft)}
.modal .price{font-weight:900; color:var(--heat); font-size:1.35rem} .modal .demo{font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); text-align:center; margin-top:14px}

@media print{ .sidebar,.appbar,.mobtabs,.rail-actions,.sticky-cta,#toast{display:none!important} .shell{grid-template-columns:1fr} .bprofile{grid-template-columns:1fr} .card{break-inside:avoid} }
</style>

function rentSummary(bid){ const rs=reviewsFor(bid).filter(r=>r.rent>0&&!r.ext);

  const beds=Object.keys(byBed).sort();
  const rows=beds.map(b=>{const v=byBed[b];return {beds:b,min:Math.min(...v),max:Math.max(...v),n:v.length};});
  const renewals=rs.map(r=>r.renewalPct).filter(x=>x>0);
  const fees=[]; const mv=rs.map(r=>r.moveInFee).filter(x=>x>0); if(mv.length)fees.push('$'+Math.round(median(mv))+' move-in fee');
  const pk=rs.map(r=>r.parking).filter(x=>x>0); if(pk.length)fees.push('$'+Math.round(median(pk))+'/mo parking');
  const pet=rs.map(r=>r.petFee).filter(x=>x>0); if(pet.length)fees.push('$'+Math.round(median(pet))+' pet fee');

function unitInsights(bid){ const rs=reviewsFor(bid).filter(r=>r.unit2&&!r.ext);
  if(!rs.length) return null; const out=[];
  // pests
  const pestCount={}; rs.forEach(r=>(r.unit2.pests||[]).forEach(p=>{if(p!=='None')pestCount[p]=(pestCount[p]||0)+1;}));
  const pests=Object.entries(pestCount).sort((a,b)=>b[1]-a[1]);
  if(pests.length) out.push({icon:'🐁',t:'Pests reported',v:pests.map(p=>p[0]+' ('+p[1]+')').join(', ')});
  else out.push({icon:'✅',t:'Pests',v:'No pests reported by reviewers'});
  // heat type + radiator temp
  const heat={}; rs.forEach(r=>{const h=r.unit2.heatType;if(h)heat[h]=(heat[h]||0)+1;});
  const topHeat=Object.entries(heat).sort((a,b)=>b[1]-a[1])[0];
  const freezing=rs.filter(r=>r.unit2.radTemp==='Freezing').length; const hot=rs.filter(r=>r.unit2.radTemp==='Window-open hot').length;
  if(topHeat) out.push({icon:'🔥',t:'Heat',v:'Mostly '+topHeat[0].toLowerCase()+(freezing?` · ${freezing} reported "freezing"`:'')+(hot?` · ${hot} reported "window-open hot"`:'')});
  // noise by facing
  const streetNoise=rs.filter(r=>r.unit2.exposure==='Street'&&r.sub&&r.sub.noise);
  const otherNoise=rs.filter(r=>r.unit2.exposure&&r.unit2.exposure!=='Street'&&r.sub&&r.sub.noise);
  const avg=a=>a.length?a.reduce((s,r)=>s+r.sub.noise,0)/a.length:0;
  if(streetNoise.length&&otherNoise.length&&avg(streetNoise)<avg(otherNoise)-0.6)
    out.push({icon:'🔊',t:'Noise',v:'Reviewers report worse soundproofing in street-facing units'});
  // AC
  const ac={}; rs.forEach(r=>{const a=r.unit2.acType;if(a)ac[a]=(ac[a]||0)+1;});
  const topAc=Object.entries(ac).sort((a,b)=>b[1]-a[1])[0];
  if(topAc) out.push({icon:'❄️',t:'Cooling',v:'Mostly '+topAc[0].toLowerCase()});
  return {items:out,n:rs.length};
}

/* When the app is served from its own host (not the claude.ai artifact), reviews/
   issues/Q&A/names/photos are SHARED across every visitor via the backend API.
   On the artifact (no backend) COM stays empty and everything falls back to local. */
const COM={reviews:[],issues:[],qa:[],names:{},photos:[],helpful:{},byB:{},_lastTs:0,on:false};
function comBase(){let b=apiBase();if(b)return b.replace(/\/+$/,'');
  if(typeof location!=='undefined'&&location.protocol.indexOf('http')===0&&!/claude|anthropic|usercontent|localhost127/.test(location.hostname))return '';
  return null;}
function comIndex(){COM.byB={};['reviews','issues','qa','photos'].forEach(k=>COM[k].forEach(x=>{const o=(COM.byB[x.b]=COM.byB[x.b]||{reviews:[],issues:[],qa:[],photos:[]});o[k].push(x);}));}
function comMergeArr(dst,items){const idx={};dst.forEach((x,i)=>idx[x.id]=i);items.forEach(it=>{if(idx[it.id]!=null)dst[idx[it.id]]=it;else{idx[it.id]=dst.length;dst.push(it);}});}
async function comPull(){const base=comBase();if(base===null)return;try{
  const url=base+'/api/community'+(COM._lastTs?('?since='+COM._lastTs):'');
  const res=await fetch(url,{cache:'no-store'});if(!res.ok)return;const d=await res.json();COM.on=true;
  // normalize into the shapes the UI already renders
  const revs=(d.reviews||[]).map(r=>Object.assign({},r,{mine:false,date:r.ts,helpful:(d.helpful&&d.helpful[r.id])||r.helpful||0}));
  const iss=(d.issues||[]).map(i=>Object.assign({},i,{mine:false}));
  const qas=(d.qa||[]).map(q=>({id:q.id,b:q.b,text:q.q,author:q.by||'A neighbor',date:q.ts,replies:q.a?[{text:q.a,author:q.by||'A neighbor',date:q.ts}]:[]}));
  comMergeArr(COM.reviews,revs);comMergeArr(COM.issues,iss);comMergeArr(COM.qa,qas);comMergeArr(COM.photos,(d.photos||[]));
  Object.assign(COM.names,d.names||{});Object.assign(COM.helpful,d.helpful||{});
  if(d.now)COM._lastTs=d.now;comIndex();clearCaches();

function percentileOf(b){if(b.demo||b.lat==null)return null;const peers=REAL.filter(x=>x.hood===b.hood);if(peers.length<4)return null;const better=peers.filter(x=>x.open>b.open).length;const worse=peers.filter(x=>x.open<b.open).length;return {betterPct:Math.round(better/peers.length*100),worsePct:Math.round(worse/peers.length*100),clean:b.open===0};}
function portfolioOf(b){if(b.demo){const s=DEMO.filter(x=>x.co===b.co);return{key:b.co,name:b.co,buildings:s};}const s=REAL.filter(x=>x.pg&&x.pg===b.pg);return{key:b.pg,name:'City property group #'+b.pg,buildings:s};}
/* ===== management-company naming (shared, keyed by property group) ===== */
function mgrKey(b){return 'pg'+((b&&b.pg)||'');}
function managerNameOf(b){if(!b)return null;if(b.demo)return b.co||null;const k=mgrKey(b);return (S.names&&S.names[k])||(COM.names&&COM.names[k])||null;}
function nameManager(bid){const b=bById(bid);if(!b||b.demo||!b.pg)return;const k=mgrKey(b);const cur=(S.names&&S.names[k])||'';const v=prompt('Who manages these buildings? Name the property-management company (e.g. "Pangea", "Planned Property Management") so renters can look them up:',cur);if(v===null)return;if(!S.names)S.names={};const t=v.trim();if(t){S.names[k]=t;comPush('names',{b:k,name:t,by:(S.handle||'A neighbor')});}else delete S.names[k];persist();render();toast(t?'Company named — now searchable across the web':'Name removed');}
/* ===== "Around the web" deep links (no API needed — opens each site's live search) ===== */
function webLinks(name,isCompany){const chi=' Chicago';const enc=s=>encodeURIComponent(s);
  return {
    reddit:'https://www.reddit.com/search/?q='+enc('"'+name+'"'+chi)+'&sort=relevance',
    googleReddit:'https://www.google.com/search?q='+enc('site:reddit.com '+name+chi),
    google:'https://www.google.com/search?q='+enc(name+chi+(isCompany?' reviews':' apartment reviews')),
    yelp:'https://www.yelp.com/search?find_desc='+enc(name)+'&find_loc='+enc('Chicago, IL')
  };
}
function aroundWebCard(name,isCompany){if(!name)return '';const L=webLinks(name,isCompany);
  const btn=(href,label,sub,ic)=>`<a class="webbtn" href="${href}" target="_blank" rel="noopener noreferrer"><span class="wbi">${ic}</span><span class="wbtxt"><span class="wbt">${label}</span><span class="wbs">${sub}</span></span><span class="wbx">↗</span></a>`;
  return `<div class="card"><div class="card-h"><span class="t">🌐 Around the web</span></div><div class="card-b">
    <p class="small-note" style="margin:0 0 12px">See what Chicago renters say about <b style="color:var(--ink)">${esc(name)}</b> elsewhere — live, in their own words. Each opens that site's real search in a new tab.</p>
    <div class="webbtns">
      ${btn(L.reddit,'Reddit','Threads mentioning '+(isCompany?'this company':'this building'),'👽')}
      ${btn(L.googleReddit,'Reddit via Google','Often surfaces more threads','🔎')}
      ${btn(L.google,'Google','Ratings &amp; mentions','⭐')}
      ${btn(L.yelp,'Yelp','Business reviews','📣')}
    </div>
    <div class="src-note" style="margin-top:12px">Radiator links out to public discussion — it doesn't publish or endorse it. Read the original before drawing conclusions.</div>
  </div></div>`;
}
function qaFor(bid){const base=isDemo()?DEMO_QA.filter(q=>q.b===bid):comQA(bid);return dedupById(base,S.qa.filter(q=>q.b===bid));}
function issuesFor(bid){const base=isDemo()?DEMO_ISSUES.filter(x=>x.b===bid):comIssues(bid);return dedupById(base,(S.issues||[]).filter(x=>x.b===bid));}
function openIssuesFor(bid){return issuesFor(bid).filter(i=>i.status!=='resolved').sort((a,c)=>daysOpen(c.date)-daysOpen(a.date));}
function daysOpen(d){const t=Date.parse((d||'')+'T00:00:00');if(isNaN(t))return 0;return Math.max(0,Math.floor((now()-t)/DAY));}
function daysTier(n){return n>=60?2:n>=21?1:0;}
function nameOf(b){return (b&&S.names&&S.names[b.id])||(b&&COM.names&&COM.names[b.id])||(b&&b.name)||'';}
function hasCustomName(b){return !!(b&&((S.names&&S.names[b.id])||(COM.names&&COM.names[b.id])));}
function bPhotos(bid){const out=[];((S.bphotos&&S.bphotos[bid])||[]).forEach(p=>out.push(p));comPhotos(bid).forEach(p=>out.push(p));reviewsFor(bid).forEach(r=>(r.photos||[]).forEach(p=>out.push(p)));issuesFor(bid).forEach(i=>(i.photos||[]).forEach(p=>out.push(p)));return out;}
function fmtFull(d){if(!d)return '';const t=Date.parse(d+'T00:00:00');if(isNaN(t))return d;const dt=new Date(t);const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return M[dt.getMonth()]+' '+dt.getDate()+', '+dt.getFullYear();}
function todayISO(){const dt=new Date(now());const p=n=>String(n).padStart(2,'0');return dt.getFullYear()+'-'+p(dt.getMonth()+1)+'-'+p(dt.getDate());}
function hasAccess(){return S.unlockedUntil>now();}
function accessDaysLeft(){return Math.max(0,Math.ceil((S.unlockedUntil-now())/DAY));}
function summaryOf(b){
  if(b.demo){const d=b.data;return `Sample building for demonstration. It carries ${d.viol} illustrative open violation${d.viol===1?'':'s'}${d.evict?' and '+d.evict+' eviction filing'+(d.evict===1?'':'s'):''}${d.problem?', and is flagged on a sample problem-landlord list':''}. Switch to Live mode for real City of Chicago records.`;}
  const parts=[];const pct=percentileOf(b);
  parts.push(`This ${esc(b.hood)} building has <b>${b.open} open building violation${b.open===1?'':'s'}</b> on file with the City of Chicago`);
  if(b.fixed)parts.push(`, with ${b.fixed} resolved since 2024`);
  parts.push('. ');
  if(pct!=null){ if(pct.clean) parts.push(`It currently has a clean open-violation record — among the best buildings we track in ${esc(b.hood)}. `);
    else if(pct.betterPct>=50) parts.push(`That's safer than <b>${pct.betterPct}%</b> of buildings we track in ${esc(b.hood)}. `);
    else parts.push(`That's more open violations than <b>${pct.worsePct}%</b> of buildings we track in ${esc(b.hood)}. `);}
  if(b.cats&&b.cats.length)parts.push(`Most issues fall under <b>${esc(b.cats[0].d)}</b>${b.cats[1]?' and '+esc(b.cats[1].d):''}. `);
  if(b.last)parts.push(`The most recent violation was filed ${fmtDate(b.last)}. `);
  const r=ratingOf(b.id);
  parts.push(r.n?`Tenants rate it <b>${r.avg.toFixed(1)}/5</b> across ${r.n} review${r.n===1?'':'s'}.`:`No tenants have reviewed it yet — the records above tell the story so far.`);
  return parts.join('');
}
function fmtDate(d){if(!d)return '—';const[y,m]=d.split('-');const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return (M[(+m||1)-1]||'')+' '+y;}
function starsHTML(v){const p=clampN(v/5*100,0,100);return `<span class="stars" role="img" aria-label="${v.toFixed(1)} of 5"><span class="stars-base">★★★★★</span><span class="stars-fill" style="width:${p}%">★★★★★</span></span>`;}
function initialOf(s){s=(s||'').trim();return s?s[0].toUpperCase():'R';}
function flagHTML(b){const r=riskOf(b);return `<span class="flag ${RISK_CLASS[r]}"><span class="dot"></span>${RISK_LABEL[r]}</span>`;}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600);}

function go(v,id){nav.prev.push({view:nav.view,id:nav.id});nav.view=v;nav.id=id||null;scrollTo(0,0);render();}

function viewExplore(){
  let list=buildings();
  if(hoodFilter!=='all')list=list.filter(b=>b.hood===hoodFilter);
  if(riskFilter!=='all')list=list.filter(b=>RISK_CLASS[riskOf(b)]===riskFilter);
  if(searchQ.trim()){const q=searchQ.toLowerCase();list=list.filter(b=>(b.name||'').toLowerCase().includes(q)||(b.addr||'').toLowerCase().includes(q)||(b.hood||'').toLowerCase().includes(q)||nameOf(b).toLowerCase().includes(q));}
  list.forEach(b=>{b._r=ratingOf(b.id);b._s=scoreOf(b);});
  if(sortBy==='score')list.sort((a,b)=>b._s-a._s);
  else if(sortBy==='risk')list.sort((a,b)=>riskOf(b)-riskOf(a)||(b.open||0)-(a.open||0));
  else if(sortBy==='rating')list.sort((a,b)=>b._r.avg-a._r.avg||b._r.n-a._r.n);
  else if(sortBy==='reviews')list.sort((a,b)=>b._r.n-a._r.n);

function drawMap(mountId){const mount=$('#'+mountId);if(!mount||!CHI.hoods||!CHI.bbox){if(mount)mount.innerHTML='<div class="empty" style="padding:30px">Map unavailable</div>';return;}
  const bb=CHI.bbox;const latMid=(bb.minLat+bb.maxLat)/2;const kx=Math.cos(latMid*Math.PI/180);
  const W=1000;const lngSpan=(bb.maxLng-bb.minLng)*kx;const latSpan=(bb.maxLat-bb.minLat);const H=Math.round(W*(latSpan/lngSpan));
  const X=lng=>((lng-bb.minLng)*kx)/lngSpan*W;const Y=lat=>(bb.maxLat-lat)/latSpan*H;
  let list=REAL.slice();
  if(hoodFilter!=='all')list=list.filter(b=>b.hood===hoodFilter);
  if(riskFilter!=='all')list=list.filter(b=>RISK_CLASS[riskOf(b)]===riskFilter);
  if(searchQ.trim()){const q=searchQ.toLowerCase();list=list.filter(b=>(b.addr||'').toLowerCase().includes(q)||(b.hood||'').toLowerCase().includes(q));}
  const totalDots=list.length; let sampled=false;
  if(list.length>MAP_CAP){const step=Math.ceil(list.length/MAP_CAP);list=list.filter((_,i)=>i%step===0);sampled=true;}
  const paths=CHI.hoods.map(h=>{if(!h.ring||h.ring.length<3)return '';const sel=hoodFilter!=='all'&&h.name===hoodFilter;const d='M'+h.ring.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join('L')+'Z';return `<path class="hoodpath${sel?' sel':''}" d="${d}" data-hood="${esc(h.name)}"/>`;}).join('');
  const asPins = list.length<=600;
  const marks=list.map(b=>{if(b.lat==null)return '';const r=riskOf(b);const cls=['g','w','r'][r];const x=X(b.lng).toFixed(1);const y=Y(b.lat).toFixed(1);
    if(asPins){const k=(r===2?2.0:r===1?1.7:1.5).toFixed(2);return `<g class="bpin ${cls}" data-id="${b.id}" transform="translate(${x},${y}) scale(${k})"><path d="M0,0 C-6,-10 -6,-16 0,-16 C6,-16 6,-10 0,0 Z"/><circle cx="0" cy="-11" r="2.6" fill="#fff" pointer-events="none"/></g>`;}
    const rad=r===2?4.2:r===1?3.2:2.6;return `<circle class="bdot ${cls}" cx="${x}" cy="${y}" r="${rad}" data-id="${b.id}"/>`;}).join('');
  mount.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-label="Chicago building risk map">${paths}${marks}</svg>`;
  const cap=$('#mapcap'); if(cap) cap.textContent = sampled?`Showing a ${list.length.toLocaleString()}-building sample of ${totalDots.toLocaleString()} — pick a neighborhood to see every one.`:`${totalDots.toLocaleString()} building${totalDots===1?'':'s'} shown · source: City of Chicago`;
  mount.querySelector('svg').addEventListener('click',e=>{const t=e.target;const pin=t&&t.closest?t.closest('.bpin'):null;
    if(t&&t.classList.contains('bdot')){const id=t.getAttribute('data-id');if(id)go('building',id);}
    else if(pin){const id=pin.getAttribute('data-id');if(id)go('building',id);}
    else if(t&&t.classList.contains('hoodpath')){const h=t.getAttribute('data-hood');if(h){hoodFilter=h;render();}}});
}

function addBuildingPhotos(bid){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;inp.onchange=()=>{const files=[...inp.files].slice(0,8);let pending=files.filter(f=>f.type.startsWith('image/')).length;if(!pending){toast('No image selected');return;}files.forEach(f=>{if(f.type.startsWith('image/'))shrink(f,u=>{if(!S.bphotos)S.bphotos={};(S.bphotos[bid]=S.bphotos[bid]||[]).push(u);comPush('photos',{id:'ph'+now().toString(36)+Math.floor(Math.random()*1e4).toString(36),b:bid,photo:u,by:(S.handle||'')});pending--;if(pending<=0){persist();render();toast('Photo added');}});});};inp.click();}

    summary=all.length?`<div class="srcsum">${sk.map(s=>{const arr=bySrc[s];const S2=SOURCES[s]||{name:s};const disc=s==='reddit';const av=arr.reduce((a,x)=>a+x.overall,0)/arr.length;return `<div class="s"><span class="srcbadge ${S2.cls||''}">${S2.name}</span>${disc?`<span class="sv" style="font-size:15px">💬</span><span class="sn">${arr.length} mention${arr.length===1?'':'s'}</span>`:`<span class="sv">${av.toFixed(1)}</span><span class="sn">${arr.length} review${arr.length===1?'':'s'}</span>`}</div>`;}).join('')}</div>`:'';
  }

  const chips=fk.length>1?`<div class="srcfilter"><button class="${filter==='all'?'on':''}" onclick="setSrcFilter('all')">All ${all.length}</button>${fk.map(s=>`<button class="${filter===s?'on':''}" onclick="setSrcFilter('${s}')">${(SOURCES[s]||{}).name||s} ${bySrc[s].length}</button>`).join('')}</div>`:'';

  else if(hasAccess()){body=list.length?list.map(revHTML).join(''):'<p class="small-note" style="padding:10px 0">No reviews from this source.</p>';}
  else if(filter==='all'){const exShown=list.filter(rv=>(rv.src||'radiator')!=='radiator');const rad=list.filter(rv=>(rv.src||'radiator')==='radiator');body=exShown.map(revHTML).join('')+(rad[0]?revHTML(rad[0]):'');if(rad.length>1)body+=wallHTML(bid,rad.slice(1));}

  return `<h1 class="page-t">Neighborhoods</h1><p class="page-sub">All 77 Chicago community areas ranked by average open building violations across the buildings we track. Click one to explore its buildings.</p>
  <div class="nbgrid">${stats.map(h=>{const tot=h.high+h.watch+h.good||1;return `<button class="nbcard" onclick="go('neighborhood','${esc(h.hood)}')">
    <div class="nn">${esc(h.hood)}</div><div class="ns">${h.n} building${h.n===1?'':'s'} · avg ${h.avgOpen} open</div>
    <div class="nbbar"><i class="r" style="width:${h.high/tot*100}%"></i><i class="w" style="width:${h.watch/tot*100}%"></i><i class="g" style="width:${h.good/tot*100}%"></i></div>
    <div class="nbstat"><span style="color:var(--risk)"><b>${h.high}</b> high</span><span style="color:var(--watch)"><b>${h.watch}</b> watch</span><span style="color:var(--good)"><b>${h.good}</b> good</span></div>
  </button>`;}).join('')}</div>`;
}
function viewNeighborhood(name){const h=HOOD_STATS.find(x=>x.hood===name);const bs=REAL.filter(b=>b.hood===name).map(b=>{b._r=ratingOf(b.id);b._s=scoreOf(b);return b;}).sort((a,b)=>a.open-b.open);
  if(!h)return '<div class="empty">Neighborhood not found</div>';
  return `<div class="acct-hero"><div class="av" style="background:var(--azure)">📍</div><div><div class="h">${esc(name)}</div><div class="s">${h.n} tracked building${h.n===1?'':'s'} · ${h.avgOpen} avg open violations</div></div></div>

/* ============ TOOLS ============ */
function viewTools(){
  return `<h1 class="page-t">Chicago RLTO tools</h1><p class="page-sub">Free tenant tools built around Chicago's Residential Landlord &amp; Tenant Ordinance — the kind of thing no other rental-review app offers.</p>
  <div class="toolgrid">
    <div class="card"><div class="card-h"><span class="t">💰 Security deposit interest</span></div><div class="card-b">
      <p class="small-note" style="margin-bottom:14px">Chicago landlords who hold a security deposit must pay tenants annual interest at a rate the City sets each year. Estimate what you're owed.</p>
      <div class="field"><label>Deposit amount ($)</label><input type="number" id="dep-amt" value="1800" inputmode="numeric" oninput="calcDeposit()"></div>
      <div class="grid2"><div class="field"><label>Months held</label><input type="number" id="dep-mo" value="12" inputmode="numeric" oninput="calcDeposit()"></div>
        <div class="field"><label>Annual rate (%)</label><input type="number" id="dep-rate" value="0.01" step="0.001" inputmode="decimal" oninput="calcDeposit()"></div></div>
      <div class="calc-out"><div class="big" id="dep-out">$0.02</div><div class="lbl">estimated interest owed</div></div>
      <p class="small-note" style="margin-top:10px">The City sets the official rate annually (recent rates have been near 0.01%). Verify the current rate before relying on this.</p>
    </div></div>
    <div class="card"><div class="card-h"><span class="t">📅 Rent-increase notice checker</span></div><div class="card-b">
      <p class="small-note" style="margin-bottom:14px">Under Chicago's Fair Notice Ordinance, the longer you've lived somewhere, the more written notice a landlord must give before raising rent or not renewing.</p>
      <div class="field"><label>How long have you lived here?</label><select id="ni-ten" onchange="calcNotice()"><option value="30">Less than 6 months</option><option value="60" selected>6 months to 3 years</option><option value="120">3 years or more</option></select></div>
      <div class="field"><label>Date landlord gave notice (optional)</label><input type="date" id="ni-date" onchange="calcNotice()"></div>
      <div class="notice-out" id="ni-out"></div>
    </div></div>
  </div>
  <div class="card" style="margin-top:16px"><div class="card-h"><span class="t">📖 Know your rights</span></div><div class="card-b"><p class="small-note" style="margin-bottom:12px">A plain-English rundown of the core RLTO protections most Chicago renters are covered by.</p><button class="btn outline" style="width:auto;display:inline-flex" onclick="go('guide',null)">Open the tenant-rights guide →</button></div></div>
  <p class="small-note" style="margin-top:18px">These tools are educational estimates, not legal advice. For a dispute, contact the City of Chicago or a tenants' rights organization.</p>`;
}
function calcDeposit(){const amt=parseFloat($('#dep-amt').value)||0;const mo=parseFloat($('#dep-mo').value)||0;const rate=parseFloat($('#dep-rate').value)||0;
  const interest=amt*(rate/100)*(mo/12);$('#dep-out').textContent='$'+interest.toFixed(2);}
function calcNotice(){const days=parseInt($('#ni-ten').value);const el=$('#ni-out');const dstr=$('#ni-date').value;
  let msg=`Your landlord must give you at least <b>${days} days</b> written notice before raising your rent or declining to renew your lease.`;
  if(dstr){const d=new Date(dstr+'T00:00:00');if(!isNaN(d)){const eff=new Date(d.getTime()+days*DAY);const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    msg+=` Based on notice given ${M[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}, the increase can't take effect before <b>${M[eff.getMonth()]} ${eff.getDate()}, ${eff.getFullYear()}</b>.`;}}
  el.innerHTML=msg;}
function viewGuide(){
  return `<div class="guide" style="max-width:720px">
  <h1 class="page-t">Chicago tenant rights, in plain English</h1><p class="page-sub">A quick overview of the Residential Landlord &amp; Tenant Ordinance (RLTO). Educational only — not legal advice.</p>
  <h3>Security deposits</h3><p>If your landlord holds a deposit, they must keep it in a separate account, give you a receipt, <b>pay annual interest</b> at the City's set rate, and return it within <b>45 days</b> of you moving out (with itemized deductions within 30 days). Chicago's deposit rules are strict — many violations are technical, and penalties can be significant.</p>
  <h3>Rent increases &amp; non-renewal</h3><p>Under the Fair Notice Ordinance, required written notice scales with tenancy: <b>30 days</b> under 6 months, <b>60 days</b> from 6 months to 3 years, and <b>120 days</b> at 3+ years. Use the notice checker in Tools to see your window.</p>
  <h3>Repairs &amp; heat</h3><p>Landlords must maintain the unit to code and provide adequate heat during heat season (Sept 15–Jun 1): at least <b>68°F day / 66°F night</b>. If repairs aren't made after proper written notice, tenants have remedies including repair-and-deduct for smaller issues.</p>
  <h3>Entry</h3><p>Except in emergencies, a landlord must give at least <b>48 hours notice</b> (RLTO says 2 days) before entering, at reasonable times.</p>
  <h3>Retaliation</h3><p>It's illegal for a landlord to retaliate — by raising rent, cutting services, or trying to evict — because you complained to the City, requested repairs, or joined a tenant organization.</p>
  <p class="small-note" style="margin-top:20px">Always confirm current specifics with the City of Chicago Department of Housing or a tenants' rights group before acting.</p></div>`;
}

    </div>
    <div class="field" style="margin:0"><label>Overall rating <span style="color:var(--risk)">*</span></label><div class="star-input" id="si-overall">${[1,2,3,4,5].map(i=>`<button type="button" onclick="setStar('overall',${i})">★</button>`).join('')}</div></div>

    <div class="form-group"><div class="fg-t">⭐ Rate the specifics <span style="font-weight:500;color:var(--ink-faint);font-size:12px">— all optional</span></div><div class="mini-dims">${dimRows}</div></div>

function initWriteForm(){draft={overall:0,sub:{},photos:[],unit:{pests:[],nearby:[],noiseSrc:[]},would:null,surprise:null};REVIEW_DIMS.forEach(d=>draft.sub[d.k]=0);prefillAddr='';}
function setStar(k,v){if(k==='overall')draft.overall=v;else draft.sub[k]=v;const w=$('#si-'+k);if(w)[...w.children].forEach((btn,i)=>btn.classList.toggle('on',i<v));}
function toggleUnitMulti(k,v,el){if(!draft.unit[k])draft.unit[k]=[];const i=draft.unit[k].indexOf(v);if(i>=0){draft.unit[k].splice(i,1);el.classList.remove('on');}else{draft.unit[k].push(v);el.classList.add('on');}}
function setWould(v,el){draft.would=v;[...el.parentNode.children].forEach(b=>b.classList.remove('on'));el.classList.add('on');}
function setSurprise(v,el){draft.surprise=v;[...el.parentNode.children].forEach(b=>b.classList.remove('on'));el.classList.add('on');}
function addPhotos(files){const arr=[...files].slice(0,6-draft.photos.length);arr.forEach(f=>{if(f.type.startsWith('image/'))shrink(f,u=>{draft.photos.push(u);renderThumbs();});});}
function shrink(file,cb){const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const max=900;let w=img.width,h=img.height;if(w>h&&w>max){h=h*max/w;w=max;}else if(h>max){w=w*max/h;h=max;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);try{cb(c.toDataURL('image/jpeg',0.68));}catch(e){toast('Could not add that photo');}};img.onerror=()=>{URL.revokeObjectURL(url);toast('Could not read that image');};img.src=url;}
function renderThumbs(){const el=$('#w-thumbs');if(el)el.innerHTML=draft.photos.map((p,i)=>`<div class="th"><img src="${p}" alt=""><button type="button" onclick="rmPhoto(${i})">✕</button></div>`).join('');}
function rmPhoto(i){draft.photos.splice(i,1);renderThumbs();}
function submitReview(){let bid=$('#w-bid').value;
  if(!bid){const raw=($('#w-building')?$('#w-building').value:'').trim();if(!raw){toast('Add a building or address');return;}const pool=isDemo()?DEMO:REAL;const m=pool.find(x=>raw.toLowerCase()===x.name.toLowerCase())||pool.find(x=>raw.toLowerCase().includes(x.addr.toLowerCase().slice(0,14)));if(m)bid=m.id;else{bid='u'+now().toString(36);S.userBuildings.push({id:bid,real:true,name:raw,addr:raw,hood:'Chicago',open:0,fixed:0,last:'',lat:null,lng:null,pg:'',cats:[]});}}
  const overall=draft.overall;if(!overall){toast('Add an overall star rating');return;}
  const body=($('#w-body').value||'').trim();if(body.length<12){toast('Tell us a bit more in the review');return;}
  const val=id=>{const e=$('#'+id);return e?e.value:'';};
  const unit2={};UNIT_SINGLE.forEach(u=>{const v=val('u-'+u.k);if(v)unit2[u.k]=v;});['pests','nearby','noiseSrc'].forEach(k=>{if(draft.unit[k]&&draft.unit[k].length)unit2[k]=draft.unit[k].filter(x=>x!=='None').length?draft.unit[k].slice():draft.unit[k].slice();});
  const pt=val('w-parktype');if(pt)unit2.parkingType=pt;
  const bedsRaw=val('w-beds');const beds=bedsRaw===''?null:parseInt(bedsRaw);
  const rv={id:'u'+now().toString(36)+Math.floor(Math.random()*1e4).toString(36),b:bid,overall,sub:Object.assign({},draft.sub),
    title:($('#w-title').value||'').trim(),body,wish:($('#w-wish').value||'').trim(),
    rent:parseInt(val('w-rent'))||0,beds,renewalPct:parseInt(val('w-renewal'))||0,moveInFee:parseInt(val('w-movein'))||0,parking:parseInt(val('w-parking'))||0,petFee:parseInt(val('w-pet'))||0,
    yearBuilt:parseInt(val('w-year'))||0,
    moveIn:($('#w-in').value||'').trim(),moveOut:($('#w-out').value||'').trim(),status:val('w-status')||'current',
    would:draft.would,surprise:draft.surprise,unit2:Object.keys(unit2).length?unit2:null,
    verified:$('#w-verify').checked,author:(S.handle?S.handle:'A Chicago renter'),helpful:0,photos:draft.photos.slice(),mine:true,date:now()};
  S.reviews.unshift(rv);const wasLocked=!hasAccess();S.unlockedUntil=Math.max(S.unlockedUntil,now()+30*DAY);persist();comPush('reviews',rv);
  toast(wasLocked?'Review posted — 30 days unlocked! 🎉':'Review posted — thank you!');nav.prev=[{view:'explore',id:null}];go('building',bid);}

}
function initIssueForm(){issueDraft={cat:'',photos:[]};}
function setIssueCat(k,el){issueDraft.cat=k;const g=el.parentNode;[...g.children].forEach(b=>b.classList.remove('on'));el.classList.add('on');}
function addIssuePhotos(files){const arr=[...files].slice(0,6-issueDraft.photos.length);arr.forEach(f=>{if(f.type.startsWith('image/'))shrink(f,u=>{issueDraft.photos.push(u);renderIssueThumbs();});});}
function renderIssueThumbs(){const el=$('#i-thumbs');if(el)el.innerHTML=issueDraft.photos.map((p,i)=>`<div class="th"><img src="${p}" alt=""><button type="button" onclick="rmIssuePhoto(${i})">✕</button></div>`).join('');}
function rmIssuePhoto(i){issueDraft.photos.splice(i,1);renderIssueThumbs();}
function submitIssue(){let bid=$('#i-bid').value;
  if(!bid){const raw=($('#i-building')?$('#i-building').value:'').trim();if(!raw){toast('Add a building or address');return;}const pool=isDemo()?DEMO:REAL;const m=pool.find(x=>raw.toLowerCase()===x.name.toLowerCase())||pool.find(x=>raw.toLowerCase().includes(x.addr.toLowerCase().slice(0,14)));if(m)bid=m.id;else{bid='u'+now().toString(36);S.userBuildings.push({id:bid,real:true,name:raw,addr:raw,hood:'Chicago',open:0,fixed:0,last:'',lat:null,lng:null,pg:'',cats:[]});}}
  const cat=issueDraft.cat;if(!cat){toast('Pick a problem type');return;}
  const title=($('#i-title').value||'').trim();if(title.length<4){toast('Add a short summary');return;}
  const date=($('#i-date').value||todayISO());
  const iss={id:'i'+now().toString(36)+Math.floor(Math.random()*1e4).toString(36),b:bid,cat,title,desc:($('#i-desc').value||'').trim(),date,status:'open',by:(S.handle||'You'),mine:true,photos:issueDraft.photos.slice()};
  if(!S.issues)S.issues=[];S.issues.unshift(iss);persist();comPush('issues',iss);toast('Issue logged — the clock is running. 🔥');nav.prev=[{view:'explore',id:null}];go('building',bid);}

/* ============ SAVED ============ */
function viewSaved(){const bs=S.saved.map(bById).filter(Boolean).map(b=>{b._r=ratingOf(b.id);b._s=scoreOf(b);return b;});
  return `<h1 class="page-t">Your watchlist</h1><p class="page-sub">Buildings you're keeping an eye on while you hunt. ${bs.length?'':'Save any building to track it here.'}</p>
  ${bs.length?`<div class="card" style="margin-bottom:16px"><div class="card-b" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><div style="font-weight:700">🔔 Violation alerts</div><div class="small-note">Get emailed when a watchlisted building gets a new violation. ${S.alertsOn?'<b style="color:var(--good)">On</b>':'Off'} <span class="small-note">(demo)</span></div></div><button class="btn ${S.alertsOn?'ghost':'primary'} sm" style="width:auto;display:inline-flex" onclick="toggleAlerts()">${S.alertsOn?'Turn off':'Turn on alerts'}</button></div></div>
    <div class="bgrid">${bs.map(bcard).join('')}</div>`
  :`<div class="empty"><div class="em">🔖</div><div class="t">Nothing on your watchlist</div><div class="d">Tap “Add to watchlist” on any building to track it here.</div><div style="margin-top:16px"><button class="btn primary" style="width:auto;display:inline-flex" onclick="tab('explore')">Browse buildings</button></div></div>`}`;
}
function toggleAlerts(){S.alertsOn=!S.alertsOn;persist();render();toast(S.alertsOn?'Alerts on (demo)':'Alerts off');}

/* ============ PROFILE ============ */
function viewProfile(){const access=hasAccess();const days=accessDaysLeft();const my=S.reviews.length;const plan=S.plan==='renter'?'Renter subscription':access?'Full access':'Free';
  return `<h1 class="page-t">Profile</h1>
  <div class="acct-hero"><div class="av">${initialOf(S.handle||'You')}</div><div><div class="h">${esc(S.handle||'Set your handle')}</div><div class="s">${plan} · <span class="modeflag ${isDemo()?'demo':'live'}">${isDemo()?'Showcase':'Live data'}</span></div></div><button class="btn outline sm" style="margin-left:auto;width:auto;display:inline-flex" onclick="editHandle()">Edit handle</button></div>
  <div class="access-card ${access?'':'locked'}"><span class="glyph">${access?'🔓':'🔒'}</span><div class="st">${access?'Full access active':'Limited access'}</div><div class="big">${access?(days>60?'Subscribed':days+' day'+(days===1?'':'s')+' left'):'Reviews are locked'}</div><div class="sm">${access?'You can read every review across Chicago.':'Post a review to unlock 30 days free, or get a pass.'}</div>${access?'':`<div style="margin-top:14px"><button class="btn" style="background:#fff;color:var(--heat-deep);width:auto;display:inline-flex" onclick="openPaywall()">Get access</button></div>`}</div>
  <div class="statgrid"><div class="statbox"><div class="n">${my}</div><div class="k">Reviews</div></div><div class="statbox"><div class="n">${S.saved.length}</div><div class="k">Watchlist</div></div><div class="statbox"><div class="n">${Object.keys(S.helpful).length}</div><div class="k">Helpful votes</div></div></div>
  <div class="section-t">Settings</div>
  <button class="rowlink" onclick="toggleMode()"><span class="ic">${isDemo()?'🎬':'🛰️'}</span><span class="t">Data source<small>${isDemo()?'Showcase — fictional buildings & sample reviews':'Live — real City of Chicago records ('+REAL.length+' buildings)'}</small></span><span class="go">Switch ${IC.chev}</span></button>
  <button class="rowlink" onclick="setApiBase()"><span class="ic">🔗</span><span class="t">Connect review sources<small>${apiBase()?'Backend connected · '+esc(apiBase()):'Add your Google/Yelp aggregation backend URL'}</small></span><span class="go">${IC.chev}</span></button>
  <button class="rowlink" onclick="toggleTheme()"><span class="ic">🌓</span><span class="t">Toggle light / dark</span><span class="go">${IC.chev}</span></button>
  <button class="rowlink" onclick="resetData()"><span class="ic">🧹</span><span class="t">Reset my data<small>Clears reviews, watchlist, compare & access on this device</small></span><span class="go">${IC.chev}</span></button>
  ${my?`<div class="section-t">My reviews</div><div class="card"><div class="card-b" style="padding-top:0">${S.reviews.map(revHTML).join('')}</div></div>`:''}
  <p class="small-note" style="margin-top:18px">Your handle, reviews, watchlist, compare and access are stored on this device and synced to your Radiator artifact when possible. <b>Live data</b> shows real City of Chicago violation records; reviews there are only those real users post. <b>Showcase</b> uses clearly-fictional buildings and sample reviews to demonstrate the experience.</p>`;
}
function editHandle(){const v=prompt('Choose a display handle (shown on your reviews):',S.handle||'');if(v!==null){S.handle=v.trim().slice(0,24);persist();render();toast('Handle updated');}}
function setApiBase(){const cur=apiBase();const v=prompt('Your Radiator aggregation backend URL (e.g. https://your-app.onrender.com). Leave blank to disconnect Google/Yelp:',cur);if(v===null)return;try{localStorage.setItem('radiator.apiBase',v.trim());}catch(e){}_extCache={};_extPending={};toast(v.trim()?'Connected — open a building to load live Google/Yelp reviews':'Disconnected');render();}
function toggleMode(){S.mode=isDemo()?'live':'demo';hoodFilter='all';riskFilter='all';searchQ='';persist();tab('explore');toast(isDemo()?'Showcase mode':'Live mode — real Chicago records');}
function toggleTheme(){const root=document.documentElement;const cur=root.getAttribute('data-theme');const isDark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;root.setAttribute('data-theme',isDark?'light':'dark');try{localStorage.setItem('radiator.theme',isDark?'light':'dark');}catch(e){}}
function resetData(){if(confirm('Reset all your Radiator data on this device? This cannot be undone.')){const mode=S.mode;S=baseState();S.mode=mode;saveLocal();clearTimeout(syncTimer);syncTimer=setTimeout(pushSync,800);toast('Your data was reset');tab('explore');}}

/* ============ PAYWALL ============ */
function openPaywall(){const root=$('#modal-root');root.innerHTML=`<div class="modal-bg" id="mbg" onclick="if(event.target.id==='mbg')closeModal()"><div class="modal"><h3>Unlock every review</h3><p>Radiator runs on a give-to-get model. The best deal is free: post a review. Or buy access.</p>
    <div class="plan pick" data-p="pass" onclick="pickPlan('pass')"><div><div class="pn">Day pass</div><div class="pd">24 hours, all reviews</div></div><div class="price">$9.99</div></div>
    <div class="plan" data-p="quarter" onclick="pickPlan('quarter')"><div><div class="pn">3-month access</div><div class="pd">Best for apartment hunting</div></div><div class="price">$19.99</div></div>
    <div class="plan" data-p="renter" onclick="pickPlan('renter')"><div><div class="pn">Renter — yearly</div><div class="pd">Unlimited, alerts, watchlist</div></div><div class="price">$79</div></div>
    <button class="btn primary full" id="buybtn" onclick="buy()">Continue</button><div class="or">or</div><button class="btn ghost full" onclick="closeModal();go('write', nav.view==='building'?nav.id:null)">Write a review — free</button><div class="demo">Demo checkout · no real payment is taken</div></div></div>`;
  requestAnimationFrame(()=>$('#mbg').classList.add('show'));openPaywall._pick='pass';}
function pickPlan(p){openPaywall._pick=p;document.querySelectorAll('.modal .plan').forEach(el=>el.classList.toggle('pick',el.dataset.p===p));}
function buy(){const p=openPaywall._pick||'pass';if(p==='pass'){S.unlockedUntil=Math.max(S.unlockedUntil,now()+DAY);S.plan='free';}else if(p==='quarter'){S.unlockedUntil=Math.max(S.unlockedUntil,now()+90*DAY);S.plan='free';}else{S.unlockedUntil=now()+365*DAY;S.plan='renter';}persist();closeModal();toast('Access unlocked (demo)');render();}
function closeModal(){const bg=$('#mbg');if(bg){bg.classList.remove('show');setTimeout(()=>$('#modal-root').innerHTML='',260);}}

/* ============ BOOT ============ */
(function(){try{const t=localStorage.getItem('radiator.theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
if(S.mode!=='live'&&S.mode!=='demo')S.mode='live';
$('#app').innerHTML='<div style="padding:70px 24px;text-align:center;color:var(--ink-faint);font-family:var(--mono);font-size:13px">Loading Chicago building records…</div>';
(async function boot(){
  try{CHI=await loadCHI();}catch(e){$('#app').innerHTML='<div style="padding:40px;text-align:center">Could not load building data. Please reload.</div>';return;}
  initData();render();
  if(nav.view==='tools'){calcDeposit();calcNotice();}
  const changed=await pullSync();if(changed){if(S.mode!=='live'&&S.mode!=='demo')S.mode='live';clearCaches();render();}
  // shared community: pull now + poll (no-op on the artifact where there is no backend)
  if(comBase()!==null){comPull();setInterval(comPull,25000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)comPull();});}
})();
</script>

</body></html>
